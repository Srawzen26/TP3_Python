<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <title>Tableau blanc</title>
  <style>canvas { border: 1px solid #000; background: #fff; }</style>
</head>
<body>
  <canvas id="c" width="800" height="600"></canvas>
  <script>
    const ctx = document.getElementById("c").getContext("2d");

    function dessiner(f) {
      const couleur = Array.isArray(f.color) ? `rgb(${f.color.join(",")})` : f.color;
      ctx.fillStyle = ctx.strokeStyle = couleur;
      ctx.beginPath();
      if (f.shape === "point") ctx.arc(f.x, f.y, 2, 0, 2 * Math.PI);
      else if (f.shape === "circle") ctx.arc(f.x, f.y, f.radius, 0, 2 * Math.PI);
      else if (f.shape === "line") { ctx.moveTo(f.x1, f.y1); ctx.lineTo(f.x2, f.y2); ctx.stroke(); return; }
      else if (f.shape === "rectangle") ctx.rect(f.x, f.y, f.width, f.height);
      else if (f.shape === "square") ctx.rect(f.x, f.y, f.cote, f.cote);
      ctx.fill();
    }

    const ws = new WebSocket(`ws://${location.host}/ws`);
    ws.onmessage = (e) => dessiner(JSON.parse(e.data));
  </script>
</body>
</html>
